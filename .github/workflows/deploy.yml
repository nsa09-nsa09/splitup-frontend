name: Frontend CI/CD

on:
  push:
    branches: ['*']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy frontend to server'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          echo "Validating docker-compose.dev.yml"
          docker compose -f docker-compose.dev.yml config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Build Docker image (test)
        run: docker build -t splitup-frontend-test .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if npm run test --if-present; then
            echo "Frontend tests passed"
          else
            echo "No test script found, skipping tests"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event.inputs.deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # Clean and recreate target directory
          echo "Preparing target directory..."
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "rm -rf /root/splitup/splitup-frontend && mkdir -p /root/splitup/splitup-frontend"

          # Copy frontend files to server using rsync (excludes .git, node_modules)
          echo "Copying frontend files to server..."
          rsync -avz \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            -e "ssh -p ${SSH_PORT}" \
            ./ ${SSH_USER}@${SSH_HOST}:/root/splitup/splitup-frontend/

          # Deploy frontend
          echo "Deploying frontend..."
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} << 'EOF'
            cd /root/splitup/splitup-frontend

            # Stop and remove existing frontend container
            echo "Stopping existing frontend..."
            docker compose -f docker-compose.dev.yml down || true
            docker rm -f splitup-frontend-dev || true

            # Ensure network exists
            echo "Creating network if not exists..."
            docker network create splitup-network || true

            # Start frontend
            echo "Starting frontend..."
            docker compose -f docker-compose.dev.yml up -d --build

            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker system prune -f

            echo "Deployment completed!"
          EOF

      - name: Verify deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} << 'EOF'
            echo "Checking container status..."
            docker ps | grep splitup-frontend-dev

            echo "Checking built files..."
            docker exec splitup-frontend-dev ls -la /app/dist

            echo "Deployment successful!"
          EOF
